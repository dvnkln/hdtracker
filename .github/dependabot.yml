# Checks once a month whether the actions in .github/workflows have new versions and opens
# one pull request with all updates (keeps the release build free of deprecation warnings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
